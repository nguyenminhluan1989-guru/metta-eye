<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Inter,"DejaVu Sans",sans-serif;color:#eef5f0;overflow:hidden;
background:radial-gradient(circle at 78% 30%,#174a36 0%,#0c2219 42%,#07130e 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(155,232,192,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(155,232,192,.05) 1px,transparent 1px);background-size:60px 60px}
.ring{position:absolute;right:-180px;top:560px;width:640px;height:640px;border-radius:50%;border:2px solid rgba(155,232,192,.25)}
.ring:after{content:"";position:absolute;inset:150px;border-radius:50%;border:2px solid rgba(155,232,192,.35)}
.dot{position:absolute;right:122px;top:862px;width:36px;height:36px;border-radius:50%;background:#9be8c0;box-shadow:0 0 40px #9be8c0}
.num{position:absolute;right:60px;top:640px;font-size:420px;font-weight:900;color:rgba(155,232,192,.13);line-height:1}
.wrap{position:absolute;inset:90px 90px 90px 90px;display:flex;z-index:1;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:34px;letter-spacing:.06em}
.brand i{width:18px;height:18px;border-radius:50%;background:#9be8c0;box-shadow:0 0 18px #9be8c0}
.tag{margin-top:150px;align-self:flex-start;font-weight:700;font-size:26px;letter-spacing:.14em;color:#06120c;background:#9be8c0;padding:12px 22px;border-radius:6px}
h1{margin-top:44px;font-size:var(--fs,92px);line-height:1.08;font-weight:800;letter-spacing:-.02em;max-width:900px}
h1 em{font-style:normal;color:#9be8c0}
p{margin-top:36px;font-size:40px;line-height:1.35;color:#b9d6c6;max-width:860px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid rgba(155,232,192,.25);padding-top:28px;font-size:26px;color:#8fb3a1}
.foot b{color:#eef5f0;font-size:30px;display:block;margin-bottom:6px}
.cta{font-weight:700;color:#06120c;background:#eef5f0;padding:14px 22px;border-radius:6px;font-size:26px}
.halo{position:absolute;right:-120px;bottom:120px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(155,232,192,.28),rgba(155,232,192,0) 62%)}
.ring{right:-60px!important;top:auto!important;bottom:420px;width:620px!important;height:620px!important}
.me{position:absolute;right:-150px;bottom:168px;height:800px;width:800px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.num{right:auto!important;left:600px;top:120px!important;font-size:300px!important}
h1{font-size:var(--fs,72px)!important;max-width:540px!important}
p{font-size:32px!important;max-width:450px!important}
.foot{position:relative;z-index:2;background:linear-gradient(transparent,#07130e 30%);margin-left:-90px;margin-right:-90px;padding-left:90px;padding-right:90px;padding-bottom:0}
.wrap{z-index:1}
</style></head><body><div class="grid"></div><div class="halo"></div><div class="ring"></div><img class="me" src="luan.png"><div class="num" id="num"></div>
<div class="wrap"><div class="brand"><i></i>LUÂN AI</div><div class="tag" id="tag"></div><h1 id="h"></h1><p id="p"></p>
<div class="foot"><div><b>Người Trong Cuộc</b>Nói Thật · Dạy Thật · Làm Thật</div><div class="cta">Inbox chữ AI</div></div></div>
<script>const q=new URLSearchParams(location.search.slice(1));document.getElementById('tag').textContent=q.get('t');document.getElementById('h').innerHTML=q.get('h');document.getElementById('p').textContent=q.get('p');document.getElementById('num').textContent=q.get('n')||'';if(q.get('pose')){const m=document.querySelector('.me');m.onerror=()=>{m.onerror=null;m.src='luan.png'};m.onload=()=>{if(m.naturalWidth/m.naturalHeight>0.7&&m.naturalWidth/m.naturalHeight<0.95){m.style.right='-30px';m.style.objectPosition='right bottom'}};m.src='poses/luan-'+q.get('pose')+'.png'}if(q.get('fs'))document.body.style.setProperty('--fs',q.get('fs'))</script></body></html>
